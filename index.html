<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[ SYSTEM : SF POPUP GENERATOR ]</title>
    
    <meta property="og:title" content="[ SYSTEM : SF POPUP GENERATOR ]">
    <meta property="og:description" content="코코포리아 마커 패널용 SF 컷인 생성기 (WebP 완벽 지원)">
    <meta property="og:image" content="https://huggingface.co/spaces/Nyacha/SF-Popup-Generator/resolve/main/preview.png?download=true">
    <meta name="twitter:card" content="summary_large_image">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --effect-hex: #00ffff;
            --effect-rgb: 0, 255, 255;
            --bg-color: #0a0f18;
            --container-bg: #111a28;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--container-bg);
            border: 1px solid var(--effect-hex);
            box-shadow: 0 0 15px rgba(var(--effect-rgb), 0.2);
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
            margin: 40px 20px;
            padding: 30px;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        .title-text {
            color: var(--effect-hex);
            font-size: 26px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(var(--effect-rgb), 0.5);
            letter-spacing: 1px;
            transition: color 0.3s, text-shadow 0.3s;
        }
        .subtitle-text {
            color: #8888aa;
            text-align: center;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        .color-picker-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 6px;
        }
        .color-picker-wrapper span {
            font-size: 14px;
            font-weight: bold;
            color: #ddd;
        }
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            padding: 0;
            background: transparent;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid #555; border-radius: 4px; }

        .file-upload-wrapper {
            border: 2px dashed #444;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.2);
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }
        .file-upload-wrapper:hover {
            border-color: var(--effect-hex);
            background-color: rgba(var(--effect-rgb), 0.05);
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }
        .file-upload-text {
            color: #ccc;
            font-size: 14px;
            pointer-events: none;
        }

        .preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .preview-container img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--effect-hex);
            background-color: rgba(0,0,0,0.5);
            box-shadow: 0 0 5px rgba(var(--effect-rgb), 0.3);
        }

        .btn {
            display: block;
            width: 100%;
            background-color: transparent;
            border: 2px solid var(--effect-hex);
            color: var(--effect-hex);
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }
        .btn:hover:not(:disabled) {
            background-color: var(--effect-hex);
            color: var(--container-bg);
            box-shadow: 0 0 15px rgba(var(--effect-rgb), 0.5);
        }
        .btn:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
        }
        #status-area {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: var(--effect-hex);
            min-height: 20px;
        }
        .result-area {
            margin-top: 20px;
            border-top: 1px solid #333;
            padding-top: 20px;
            display: none;
        }
        .file-list {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
            max-height: 200px;
            overflow-y: auto;
        }
        .file-list li {
            background: rgba(0,0,0,0.3);
            margin-bottom: 5px;
            padding: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .file-list a {
            color: var(--effect-hex);
            text-decoration: none;
            font-weight: bold;
        }
        .file-list a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <div class="title-text">[ SYSTEM : SF POPUP ]</div>
    <div class="subtitle-text">
        코드를 수정할 필요 없이 아래에서 색상을 바로 변경하세요!<br>
        (코코포리아와 완벽하게 호환되는 애니메이션 WebP로 바로 저장됩니다)
    </div>

    <!-- 색상 선택 UI -->
    <div class="color-picker-wrapper">
        <span>🎨 이펙트 색상 변경 : </span>
        <input type="color" id="color-picker" value="#00ffff">
    </div>

    <!-- 파일 업로드 및 미리보기 -->
    <div class="file-upload-wrapper" id="drop-zone">
        <div class="file-upload-text" id="file-label">📂 이미지를 드래그 앤 드롭하거나 클릭해서 여러 장을 선택하세요</div>
        <input type="file" id="file-input" multiple accept="image/*">
    </div>
    
    <div class="preview-container" id="preview-container"></div>

    <button class="btn" id="submit-btn" disabled>SF 애니메이션 생성 시작</button>
    <div id="status-area"></div>

    <div class="result-area" id="result-area">
        <h3 style="font-size:15px; margin-top:0;">개별 파일 다운로드</h3>
        <ul class="file-list" id="file-list"></ul>
        <button class="btn" id="zip-btn" style="border-style: dashed;">📦 모두 압축해서 다운로드 (ZIP)</button>
    </div>
</div>

<script>
    let EFFECT_R = 0, EFFECT_G = 255, EFFECT_B = 255;

    const colorPicker = document.getElementById('color-picker');
    const fileInput = document.getElementById('file-input');
    const fileLabel = document.getElementById('file-label');
    const previewContainer = document.getElementById('preview-container');
    const submitBtn = document.getElementById('submit-btn');
    const statusArea = document.getElementById('status-area');
    const resultArea = document.getElementById('result-area');
    const fileList = document.getElementById('file-list');
    const zipBtn = document.getElementById('zip-btn');

    let selectedFiles = [];
    let generatedFiles = []; 

    colorPicker.addEventListener('input', (e) => {
        const hex = e.target.value;
        EFFECT_R = parseInt(hex.substring(1, 3), 16);
        EFFECT_G = parseInt(hex.substring(3, 5), 16);
        EFFECT_B = parseInt(hex.substring(5, 7), 16);
        
        document.documentElement.style.setProperty('--effect-hex', hex);
        document.documentElement.style.setProperty('--effect-rgb', `${EFFECT_R}, ${EFFECT_G}, ${EFFECT_B}`);
    });

    fileInput.addEventListener('change', (e) => {
        selectedFiles = Array.from(e.target.files);
        previewContainer.innerHTML = ''; 

        if (selectedFiles.length > 0) {
            fileLabel.innerHTML = `✅ ${selectedFiles.length}개의 파일이 선택되었습니다.`;
            submitBtn.disabled = false;

            selectedFiles.forEach(file => {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.onload = () => URL.revokeObjectURL(img.src);
                previewContainer.appendChild(img);
            });
        } else {
            fileLabel.innerHTML = `📂 이미지를 드래그 앤 드롭하거나 클릭해서 여러 장을 선택하세요`;
            submitBtn.disabled = true;
        }
    });

    const yieldToBrowser = () => new Promise(r => setTimeout(r, 10));

    const loadImage = (file) => {
        return new Promise((resolve, reject) => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
            img.onerror = reject;
            img.src = url;
        });
    };

    function dataURLToUint8Array(dataURL) {
        const base64 = dataURL.split(',')[1];
        const binaryString = atob(base64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes;
    }

    function encodeAnimatedWebP(frames, width, height) {
        let anmfChunks = [];
        let totalAnmfSize = 0;

        for (let frame of frames) {
            let offset = 12; 
            let frameData = [];
            let frameDataSize = 0;

            while (offset < frame.buffer.length) {
                let id = String.fromCharCode(frame.buffer[offset], frame.buffer[offset+1], frame.buffer[offset+2], frame.buffer[offset+3]);
                let size = frame.buffer[offset + 4] | (frame.buffer[offset + 5] << 8) | (frame.buffer[offset + 6] << 16) | (frame.buffer[offset + 7] << 24);
                let paddedSize = size + (size % 2);

                if (id === 'ALPH' || id === 'VP8 ' || id === 'VP8L') {
                    let chunk = frame.buffer.subarray(offset, offset + 8 + paddedSize);
                    frameData.push(chunk);
                    frameDataSize += chunk.length;
                }
                offset += 8 + paddedSize;
            }

            let anmfSize = 16 + frameDataSize;
            let anmfHeader = new Uint8Array(24);
            anmfHeader.set([65, 78, 77, 70], 0); 
            anmfHeader[4] = anmfSize & 0xff; anmfHeader[5] = (anmfSize >> 8) & 0xff; anmfHeader[6] = (anmfSize >> 16) & 0xff; anmfHeader[7] = (anmfSize >> 24) & 0xff;
            
            anmfHeader[14] = (width - 1) & 0xff; anmfHeader[15] = ((width - 1) >> 8) & 0xff; anmfHeader[16] = ((width - 1) >> 16) & 0xff;
            anmfHeader[17] = (height - 1) & 0xff; anmfHeader[18] = ((height - 1) >> 8) & 0xff; anmfHeader[19] = ((height - 1) >> 16) & 0xff;
            anmfHeader[20] = frame.duration & 0xff; anmfHeader[21] = (frame.duration >> 8) & 0xff; anmfHeader[22] = (frame.duration >> 16) & 0xff;
            anmfHeader[23] = 2;

            anmfChunks.push({ header: anmfHeader, data: frameData });
            totalAnmfSize += 24 + frameDataSize;
        }

        let fileSize = 4 + 18 + 14 + totalAnmfSize;
        let finalBuffer = new Uint8Array(8 + fileSize);

        finalBuffer.set([82, 73, 70, 70], 0); 
        finalBuffer[4] = fileSize & 0xff; finalBuffer[5] = (fileSize >> 8) & 0xff; finalBuffer[6] = (fileSize >> 16) & 0xff; finalBuffer[7] = (fileSize >> 24) & 0xff;
        finalBuffer.set([87, 69, 66, 80], 8); 

        finalBuffer.set([86, 80, 56, 88], 12); 
        finalBuffer.set([10, 0, 0, 0], 16); 
        finalBuffer[20] = 0x12; 
        finalBuffer.set([0, 0, 0], 21);
        finalBuffer[24] = (width - 1) & 0xff; finalBuffer[25] = ((width - 1) >> 8) & 0xff; finalBuffer[26] = ((width - 1) >> 16) & 0xff;
        finalBuffer[27] = (height - 1) & 0xff; finalBuffer[28] = ((height - 1) >> 8) & 0xff; finalBuffer[29] = ((height - 1) >> 16) & 0xff;

        finalBuffer.set([65, 78, 73, 77], 30); 
        finalBuffer.set([6, 0, 0, 0], 34);
        finalBuffer.set([0, 0, 0, 0], 38); 
        finalBuffer[42] = 1; finalBuffer[43] = 0; 

        let offset = 44;
        for (let anmf of anmfChunks) {
            finalBuffer.set(anmf.header, offset);
            offset += 24;
            for (let chunk of anmf.data) {
                finalBuffer.set(chunk, offset);
                offset += chunk.length;
            }
        }

        return new Blob([finalBuffer], { type: 'image/webp' });
    }

    async function generateSFPopup(file) {
        const img = await loadImage(file);
        
        let w = img.width, h = img.height;
        const maxWidth = 800;
        
        if (w > maxWidth) {
            const scale = maxWidth / w;
            w = Math.floor(w * scale);
            h = Math.floor(h * scale);
        }

        // 💡 [수정됨] 크롭(Crop) 오류를 방지하기 위해 이미지를 캔버스 크기에 맞게 미리 축소해 둡니다.
        const scaledCanvas = document.createElement('canvas');
        scaledCanvas.width = w; scaledCanvas.height = h;
        const sCtx = scaledCanvas.getContext('2d');
        sCtx.drawImage(img, 0, 0, w, h);

        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const webpFrames = [];

        const addFrame = (duration) => {
            const dataURL = canvas.toDataURL('image/webp', 0.9);
            webpFrames.push({ buffer: dataURLToUint8Array(dataURL), duration: duration });
        };

        // 1. 투명 대기 프레임
        ctx.clearRect(0, 0, w, h);
        addFrame(100);

        // 2. 렌즈 플레어
        const sparklePhases = [[0.01, 100, 40], [0.06, 220, 30], [0.45, 255, 50], [0.12, 160, 40]];
        for (let [size_ratio, alpha, duration] of sparklePhases) {
            ctx.clearRect(0, 0, w, h);
            const cx = w / 2, cy = h / 2;
            const r = Math.max(2, Math.floor(Math.min(w, h) * size_ratio));
            const inner_r = Math.max(1, Math.floor(r * 0.15));
            const alphaStr = alpha / 255;

            const flare_w = Math.floor(w * size_ratio * 1.5), flare_h = Math.max(2, Math.floor(h * 0.015));
            ctx.fillStyle = `rgba(${EFFECT_R}, ${EFFECT_G}, ${EFFECT_B}, ${alphaStr * 0.7})`;
            ctx.fillRect(cx - flare_w, cy - flare_h, flare_w * 2, flare_h * 2);

            ctx.beginPath();
            ctx.moveTo(cx, cy - r); ctx.lineTo(cx + inner_r, cy - inner_r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx + inner_r, cy + inner_r);
            ctx.lineTo(cx, cy + r); ctx.lineTo(cx - inner_r, cy + inner_r); ctx.lineTo(cx - r, cy); ctx.lineTo(cx - inner_r, cy - inner_r);
            ctx.closePath();
            ctx.fillStyle = `rgba(${EFFECT_R}, ${EFFECT_G}, ${EFFECT_B}, ${alphaStr})`;
            ctx.fill();

            const cr = Math.max(1, Math.floor(inner_r * 1.2));
            ctx.beginPath(); ctx.ellipse(cx, cy, cr, cr, 0, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${alphaStr})`; ctx.fill();
            addFrame(duration);
        }

        // 3. 레이저 잔상
        let fh1 = Math.max(2, Math.floor(h * 0.015)), ty1 = Math.floor((h - fh1) / 2);
        ctx.clearRect(0, 0, w, h);
        
        // 💡 [수정됨] 원본 img 대신 크기가 맞춰진 scaledCanvas 사용
        ctx.drawImage(scaledCanvas, 0, ty1, w, fh1, 0, ty1, w, fh1);
        ctx.globalCompositeOperation = 'source-in'; 
        ctx.fillStyle = `rgba(${EFFECT_R}, ${EFFECT_G}, ${EFFECT_B}, ${200/255})`; ctx.fillRect(0, ty1, w, fh1);
        ctx.globalCompositeOperation = 'source-over';
        addFrame(30);

        // 4. 레이저 굵어짐
        let fh2 = Math.max(4, Math.floor(h * 0.08)), ty2 = Math.floor((h - fh2) / 2);
        ctx.clearRect(0, 0, w, h);
        ctx.filter = 'brightness(2.5)'; 
        
        // 💡 [수정됨] 원본 img 대신 크기가 맞춰진 scaledCanvas 사용
        ctx.drawImage(scaledCanvas, 0, ty2, w, fh2, 0, ty2, w, fh2);
        ctx.filter = 'none';
        ctx.globalCompositeOperation = 'source-atop'; 
        ctx.fillStyle = `rgba(${EFFECT_R}, ${EFFECT_G}, ${EFFECT_B}, 0.8)`; ctx.fillRect(0, ty2, w, fh2);
        ctx.globalCompositeOperation = 'source-over';
        addFrame(40);

        // 5. 홀로그램 전개
        const frameCount = 15, durationPerFrame = Math.floor(450 / frameCount);
        for (let i = 1; i <= frameCount; i++) {
            let t = i / frameCount, ease_t = 1 - Math.pow(1 - t, 3); 
            let ch = Math.max(1, Math.min(h, Math.floor(h * ease_t))), ty = Math.floor((h - ch) / 2);

            ctx.clearRect(0, 0, w, h);
            
            // 💡 [수정됨] 원본 img 대신 크기가 맞춰진 scaledCanvas 사용
            ctx.drawImage(scaledCanvas, 0, ty, w, ch, 0, ty, w, ch);

            let tint_ratio = (1 - ease_t) * 0.7;
            if (tint_ratio > 0.01) {
                ctx.globalCompositeOperation = 'source-atop';
                ctx.fillStyle = `rgba(${EFFECT_R}, ${EFFECT_G}, ${EFFECT_B}, ${tint_ratio})`; ctx.fillRect(0, ty, w, ch);
                ctx.globalCompositeOperation = 'source-over';
            }
            addFrame(durationPerFrame);
            if(i % 5 === 0) await yieldToBrowser();
        }

        statusArea.innerText = "초고속 WebP 병합 중...";
        await yieldToBrowser();
        
        return encodeAnimatedWebP(webpFrames, w, h);
    }

    submitBtn.addEventListener('click', async () => {
        submitBtn.disabled = true;
        resultArea.style.display = 'none';
        fileList.innerHTML = '';
        generatedFiles.forEach(f => URL.revokeObjectURL(f.url));
        generatedFiles = [];

        try {
            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                statusArea.innerText = `[${i+1} / ${selectedFiles.length}] ${file.name} 변환 중...`;
                await yieldToBrowser();

                const webpBlob = await generateSFPopup(file);
                
                const baseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                const newName = `SF_${baseName}.webp`;
                const url = URL.createObjectURL(webpBlob);

                generatedFiles.push({ name: newName, blob: webpBlob, url: url });

                const li = document.createElement('li');
                li.innerHTML = `
                    <span>📄 ${newName}</span>
                    <a href="${url}" download="${newName}">다운로드</a>
                `;
                fileList.appendChild(li);
            }

            statusArea.innerText = "✨ WebP 애니메이션 작업이 완료되었습니다!";
            resultArea.style.display = 'block';

        } catch (err) {
            console.error(err);
            statusArea.innerText = "❌ 처리 중 오류가 발생했습니다. 이미지가 정상적인지 확인해주세요.";
        } finally {
            submitBtn.disabled = false;
        }
    });

    zipBtn.addEventListener('click', async () => {
        if (generatedFiles.length === 0) return;
        
        const zipBtnOriginalText = zipBtn.innerText;
        zipBtn.innerText = "⏳ 압축 중입니다...";
        zipBtn.disabled = true;
        await yieldToBrowser();

        try {
            const zip = new JSZip();
            generatedFiles.forEach(f => {
                zip.file(f.name, f.blob);
            });
            const content = await zip.generateAsync({ type: "blob" });
            
            const zipUrl = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = zipUrl;
            a.download = "SF_Popups_Bundle.zip";
            a.click();
            URL.revokeObjectURL(zipUrl);
        } catch(err) {
            console.error(err);
            alert("ZIP 생성 중 오류가 발생했습니다.");
        } finally {
            zipBtn.innerText = zipBtnOriginalText;
            zipBtn.disabled = false;
        }
    });

</script>
</body>
</html>
